name: Scrape

# Primary triggers come from cron-job.org via workflow_dispatch (starts on
# time). The schedule entries below are late-firing fallbacks: GitHub cron
# routinely starts 20-40 min behind, and these UTC times drift an hour in
# winter when EDT becomes EST. The check job skips the fallback when
# cron-job.org already ran, so NetNutrition is only scraped once per slot.
on:
  schedule:
    - cron: '5 12 * * *'  # 8:05 AM EDT / 12:05 UTC
    - cron: '5 15 * * *'  # 11:05 AM EDT / 15:05 UTC
    - cron: '5 21 * * *'  # 5:05 PM EDT / 21:05 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip fallback if cron-job.org already ran this slot
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered by dispatch; always run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Slots are >=3h apart, so a successful dispatch-triggered run in
          # the last 2h means cron-job.org already covered this slot.
          cutoff=$(( $(date -u +%s) - 7200 ))
          recent=$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/runs?event=workflow_dispatch&status=success&per_page=10" \
            | jq --argjson cutoff "$cutoff" \
              '[.workflow_runs[] | select((.created_at | fromdateiso8601) > $cutoff)] | length')
          if [ "$recent" -gt 0 ]; then
            echo "cron-job.org already scraped within the last 2 hours; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No recent on-time run found; running fallback scrape."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  selenium-run:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Selenium script in Headless
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python src/bot_scrape.py

      - name: Run Muslim Calendar Script
        run: |
          python src/get_muslim_calendar.py

      - name: Commit PDF to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add docs/outputs/halal_menus.pdf
          git add outputs/halal_menus.txt
          git add docs/outputs/muslim_calendar.pdf
          git commit -m "Scraped NetNutrition & Calendar $(date -u)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main

      - name: Refresh dukeislam.org cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS "https://dukeislam.org/api/revalidate?secret=${REVALIDATE_SECRET}" \
              || echo "Revalidate ping failed (site falls back to timed revalidation)"
          else
            echo "REVALIDATE_SECRET not set; skipping cache refresh"
          fi