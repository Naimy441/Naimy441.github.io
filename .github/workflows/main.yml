name: Refresh Duke food catalog

# cron-job.org is the sole scheduler. It dispatches this workflow three times
# per day; keeping scheduling in one place prevents duplicate scrapes/builds.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh NetNutrition catalog without a browser
        run: |
          ./refresh_catalog.sh

      - name: Run Muslim Calendar Script
        run: |
          python src/get_muslim_calendar.py

      - name: Refresh Mobile Order menus from saved API session
        id: mobile-order-refresh
        continue-on-error: true
        env:
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: >-
          python3 mobile_order/refresh_with_reauth.py
          --output-dir outputs/mobile_order
          --delay 0
          --no-reauth

      - name: Report Mobile Order result
        if: always()
        run: |
          if [[ "${{ steps.mobile-order-refresh.outcome }}" != "success" ]]; then
            echo "Mobile Order refresh did not complete; existing files were preserved."
          else
            echo "Mobile Order refresh completed."
          fi

      - name: Build Nutriuni menus (Mobile Order + NetNutrition)
        run: |
          python3 src/build_nutriuni_menus.py

      - name: Commit refreshed catalog artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add docs/outputs/halal_menus.pdf
          git add outputs/halal_menus.txt
          git add outputs/restaurants
          git add dukeislam/data/nutrition.json
          git add docs/outputs/muslim_calendar.pdf
          git add outputs/mobile_order/menus outputs/mobile_order/restaurants.json outputs/mobile_order/all_restaurant_menus.json
          git add outputs/nutrition_library outputs/nutriuni
          git commit -m "Scraped NetNutrition, Calendar & Mobile Order $(date -u)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main

      - name: Refresh dukeislam.org cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS "https://dukeislam.org/api/revalidate?secret=${REVALIDATE_SECRET}" \
              || echo "Revalidate ping failed (site falls back to timed revalidation)"
          else
            echo "REVALIDATE_SECRET not set; skipping cache refresh"
          fi
