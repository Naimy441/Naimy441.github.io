name: Scrape

# cron-job.org is the sole scheduler. It dispatches this workflow three times
# per day; keeping scheduling in one place prevents duplicate scrapes/builds.
on:
  workflow_dispatch:

jobs:
  selenium-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Selenium script in Headless
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python src/bot_scrape.py

      - name: Run Muslim Calendar Script
        run: |
          python src/get_muslim_calendar.py

      - name: Commit PDF to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add docs/outputs/halal_menus.pdf
          git add outputs/halal_menus.txt
          git add docs/outputs/muslim_calendar.pdf
          git commit -m "Scraped NetNutrition & Calendar $(date -u)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main

      - name: Refresh dukeislam.org cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS "https://dukeislam.org/api/revalidate?secret=${REVALIDATE_SECRET}" \
              || echo "Revalidate ping failed (site falls back to timed revalidation)"
          else
            echo "REVALIDATE_SECRET not set; skipping cache refresh"
          fi
