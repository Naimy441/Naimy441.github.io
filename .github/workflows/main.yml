name: Scrape

# cron-job.org is the sole scheduler. It dispatches this workflow three times
# per day; keeping scheduling in one place prevents duplicate scrapes/builds.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selenium-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Selenium script in Headless
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python src/bot_scrape.py

      - name: Run Muslim Calendar Script
        run: |
          python src/get_muslim_calendar.py

      - name: Check Transact session for Mobile Order
        id: session-check
        continue-on-error: true
        env:
          TRANSACT_LOGIN_TOKEN: ${{ secrets.TRANSACT_LOGIN_TOKEN }}
          TRANSACT_USER_ID: ${{ secrets.TRANSACT_USER_ID }}
          TRANSACT_SESSION_ID: ${{ secrets.TRANSACT_SESSION_ID }}
        run: python3 mobile_order/check_transact_session.py --output-dir outputs/mobile_order

      - name: Fetch fresh Mobile Order menus
        id: menu-fetch
        if: steps.session-check.outcome == 'success'
        continue-on-error: true
        env:
          TRANSACT_LOGIN_TOKEN: ${{ secrets.TRANSACT_LOGIN_TOKEN }}
          TRANSACT_USER_ID: ${{ secrets.TRANSACT_USER_ID }}
          TRANSACT_SESSION_ID: ${{ secrets.TRANSACT_SESSION_ID }}
        run: >-
          python3 mobile_order/fetch_fresh_menus.py
          --output-dir outputs/mobile_order
          --delay 0.1

      - name: Report Mobile Order result
        if: always()
        run: |
          if [[ "${{ steps.session-check.outcome }}" != "success" ]]; then
            echo "Mobile Order refresh skipped: Transact session check failed."
          elif [[ "${{ steps.menu-fetch.outcome }}" != "success" ]]; then
            echo "Mobile Order refresh did not complete; existing files were preserved."
          else
            echo "Mobile Order refresh completed."
          fi

      - name: Commit PDF to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add docs/outputs/halal_menus.pdf
          git add outputs/halal_menus.txt
          git add docs/outputs/muslim_calendar.pdf
          git add outputs/mobile_order/menus outputs/mobile_order/restaurants.json outputs/mobile_order/all_restaurant_menus.json
          git commit -m "Scraped NetNutrition, Calendar & Mobile Order $(date -u)" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:main

      - name: Refresh dukeislam.org cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS "https://dukeislam.org/api/revalidate?secret=${REVALIDATE_SECRET}" \
              || echo "Revalidate ping failed (site falls back to timed revalidation)"
          else
            echo "REVALIDATE_SECRET not set; skipping cache refresh"
          fi
